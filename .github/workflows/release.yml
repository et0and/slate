name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild (for example v1.2.3). Leave empty to analyse commits.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  SLATE_GOOGLE_CLIENT_ID: ${{ vars.SLATE_GOOGLE_CLIENT_ID }}
  SLATE_GOOGLE_TOKEN_BROKER: ${{ vars.SLATE_GOOGLE_TOKEN_BROKER }}

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      released: ${{ steps.resolve.outputs.released }}
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install release tooling
        run: npm ci --ignore-scripts

      - name: Configure git
        run: |
          git config user.name "semantic-release-bot"
          git config user.email "semantic-release-bot@martynus.net"
          git fetch --tags

      - name: Semantic release
        id: semantic
        if: github.event_name == 'push' || !github.event.inputs.tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Resolve release
        id: resolve
        env:
          MANUAL_TAG: ${{ github.event.inputs.tag }}
          RELEASED_TAG: ${{ steps.semantic.outputs.tag }}
          RELEASED_VERSION: ${{ steps.semantic.outputs.version }}
        run: |
          set -euo pipefail
          tag="${MANUAL_TAG:-${RELEASED_TAG:-}}"
          if [ -z "$tag" ]; then
            echo "No new release was created."
            exit 0
          fi
          version="${RELEASED_VERSION:-${tag#v}}"
          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  macos:
    name: macOS universal
    needs: version
    if: needs.version.outputs.released == 'true'
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      BUILD_NUMBER: ${{ github.run_number }}
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Install Rust 1.99.1
        shell: bash
        run: rustup toolchain install 1.99.1 --profile minimal

      - name: Build universal binary
        shell: bash
        run: |
          set -euo pipefail
          rustup target add --toolchain 1.99.1 aarch64-apple-darwin x86_64-apple-darwin
          cargo build --release --locked --target aarch64-apple-darwin -p slate-app
          cargo build --release --locked --target x86_64-apple-darwin -p slate-app
          lipo -create \
            target/aarch64-apple-darwin/release/slate-desktop \
            target/x86_64-apple-darwin/release/slate-desktop \
            -output slate-desktop

      - name: Package app
        shell: bash
        run: |
          set -euo pipefail
          APP="dist/Slate.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp slate-desktop "$APP/Contents/MacOS/slate-desktop"
          cp packaging/macos/Info.plist "$APP/Contents/Info.plist"
          cp packaging/macos/AppIcon.icns "$APP/Contents/Resources/AppIcon.icns"
          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleShortVersionString ${VERSION}" \
            "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleVersion ${BUILD_NUMBER}" \
            "$APP/Contents/Info.plist"

      - name: Import Developer ID certificate
        if: env.MACOS_SIGNING_IDENTITY != ''
        env:
          MACOS_SIGNING_CERTIFICATE: ${{ secrets.MACOS_SIGNING_CERTIFICATE }}
          MACOS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${MACOS_SIGNING_CERTIFICATE:-}" || -z "${MACOS_SIGNING_CERTIFICATE_PASSWORD:-}" ]]; then
            echo "::error::MACOS_SIGNING_IDENTITY is set but the certificate or its password is missing."
            exit 1
          fi

          keychain="$RUNNER_TEMP/slate-signing.keychain-db"
          keychain_password="$(openssl rand -hex 16)"
          echo "SLATE_KEYCHAIN_PATH=$keychain" >> "$GITHUB_ENV"

          printf '%s' "$MACOS_SIGNING_CERTIFICATE" | tr -d '\n' | base64 -D > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/developer-id.p12" \
            -k "$keychain" \
            -P "$MACOS_SIGNING_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain"
          security list-keychains -d user -s \
            "$keychain" \
            $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/developer-id.p12"

          if ! security find-identity -v -p codesigning "$keychain" | grep -F "$MACOS_SIGNING_IDENTITY" >/dev/null; then
            echo "::error::The Developer ID identity '$MACOS_SIGNING_IDENTITY' is not in the imported certificate."
            exit 1
          fi

      - name: Sign app with Developer ID
        if: env.MACOS_SIGNING_IDENTITY != ''
        shell: bash
        run: |
          set -euo pipefail
          APP="dist/Slate.app"
          codesign --force --options runtime --timestamp \
            --sign "$MACOS_SIGNING_IDENTITY" \
            "$APP/Contents/MacOS/slate-desktop"
          codesign --force --options runtime --timestamp \
            --sign "$MACOS_SIGNING_IDENTITY" \
            "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Notarize and staple app
        if: env.MACOS_SIGNING_IDENTITY != ''
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${APPLE_ID:-}" || -z "${APPLE_APP_SPECIFIC_PASSWORD:-}" || -z "${APPLE_TEAM_ID:-}" ]]; then
            echo "::error::Set APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID to notarize."
            exit 1
          fi

          APP="dist/Slate.app"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/Slate-notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/Slate-notarize.zip" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose=4 "$APP"

      - name: Ad-hoc sign
        if: env.MACOS_SIGNING_IDENTITY == ''
        shell: bash
        run: |
          set -euo pipefail
          APP="dist/Slate.app"
          codesign --force --sign - "$APP/Contents/MacOS/slate-desktop"
          codesign --force --sign - "$APP"
          echo "::warning title=macOS build is not notarized::Add the Developer ID secrets in docs/release.md to sign and notarize release builds."

      - name: Package macOS zip
        shell: bash
        run: |
          set -euo pipefail
          ditto -c -k --keepParent "dist/Slate.app" "dist/slate-desktop-macos-universal.zip"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: slate-desktop-macos-universal
          path: dist/*.zip
          if-no-files-found: error

      - name: Remove signing keychain
        if: always()
        shell: bash
        run: |
          if [ -n "${SLATE_KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$SLATE_KEYCHAIN_PATH" || true
          fi

  linux:
    name: Linux x86_64
    needs: version
    if: needs.version.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Install Rust 1.99.1
        shell: bash
        run: rustup toolchain install 1.99.1 --profile minimal

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libfontconfig1-dev \
            libfreetype6-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcb-randr0-dev \
            libxcb-xtest0-dev \
            libxcb-xkb-dev \
            libxcb-render0-dev \
            libxcb-xinput-dev \
            libxcb-composite0-dev \
            libxcb-damage0-dev

      - name: Build
        run: cargo build --release --locked -p slate-app

      - name: Package
        run: |
          set -euo pipefail
          strip target/release/slate-desktop
          mkdir -p dist/package
          cp target/release/slate-desktop README.md LICENSE dist/package/
          tar -czf dist/slate-desktop-linux-x86_64.tar.gz \
            -C dist/package slate-desktop README.md LICENSE
          rm -rf dist/package

      - name: Upload Linux artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: slate-desktop-linux-x86_64
          path: dist/*.tar.gz
          if-no-files-found: error

  windows:
    name: Windows x86_64
    needs: version
    if: needs.version.outputs.released == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Install Rust 1.99.1
        shell: bash
        run: rustup toolchain install 1.99.1 --profile minimal

      - name: Locate fxc.exe
        shell: pwsh
        run: |
          $fxc = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\fxc.exe" |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $fxc) {
            throw "fxc.exe was not found in the Windows SDK"
          }
          "GPUI_FXC_PATH=$($fxc.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build
        run: cargo build --release --locked -p slate-app

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\package | Out-Null
          Copy-Item target\release\slate-desktop.exe dist\package\
          Copy-Item README.md, LICENSE dist\package\
          Compress-Archive -Path dist\package\* `
            -DestinationPath dist\slate-desktop-windows-x86_64.zip -Force
          Remove-Item -Recurse -Force dist\package

      - name: Upload Windows artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: slate-desktop-windows-x86_64
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: [version, macos, linux, windows]
    if: >-
      needs.version.outputs.released == 'true' &&
      needs.macos.result == 'success' &&
      needs.linux.result == 'success' &&
      needs.windows.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "Slate $TAG" \
              --generate-notes
          fi
          gh release upload "$TAG" dist/*.zip dist/*.tar.gz --clobber
