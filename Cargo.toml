[workspace]
resolver = "3"
members = ["crates/slate-core", "crates/slate-app"]

[workspace.package]
version = "0.5.1"
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.90"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
im = "15.1"
rayon = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "tiff", "gif", "bmp", "dds", "exr", "hdr", "ico", "pnm", "qoi", "tga"] }
kamadak-exif = "0.6"
roaring = "0.11"
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
anyhow = "1"
base64 = "0.21"
sha2 = "0.10"
google-drive = "0.10.0"
open = "5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["fs", "io-util", "net", "rt-multi-thread", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry"] }
tracing-opentelemetry = { version = "0.34", default-features = false }
opentelemetry = "0.33"
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["trace", "http-proto", "reqwest-blocking-client", "reqwest-rustls"] }

[patch.crates-io]
xattr = { path = "vendor/xattr" }

# Strict but practical Clippy policy. The exceptions cover GPUI's framework
# signatures, bounded pixel/PDF casts, and layout/render functions where
# splitting for a line-count lint would make the code harder to follow.
[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
derive_partial_eq_without_eq = "allow"
float_cmp = "allow"
future_not_send = "allow"
literal_string_with_formatting_args = "allow"
many_single_char_names = "allow"
missing_errors_doc = "allow"
needless_pass_by_ref_mut = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"
unreadable_literal = "allow"
unused_self = "allow"
