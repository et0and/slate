name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
          - name: Linux
            os: ubuntu-latest
          - name: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust 1.99.1
        shell: bash
        run: >-
          rustup toolchain install 1.99.1 --profile minimal
          --component rustfmt --component clippy

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libfontconfig1-dev \
            libfreetype6-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcb-randr0-dev \
            libxcb-xtest0-dev \
            libxcb-xkb-dev \
            libxcb-render0-dev \
            libxcb-xinput-dev \
            libxcb-composite0-dev \
            libxcb-damage0-dev

      - name: Check for committed OAuth credentials
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          if git grep -I -l -e "GOCSPX""-" -- .; then
            echo "::error::Google OAuth client secret is present in the repository."
            exit 1
          fi
          if git ls-files | grep -E '(^|/)(google-oauth|google-drive)\.json$|(^|/)client_secret_.*\.json$'; then
            echo "::error::Google OAuth credential file is tracked."
            exit 1
          fi

      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt-check

      - name: Clippy
        run: cargo lint

      - name: Test
        run: cargo test --workspace

  stress-500k:
    name: 500k stress gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust 1.99.1
        run: rustup toolchain install 1.99.1 --profile minimal

      - name: Build and run the 500k gate
        run: >-
          cargo run --release -p slate-core --example stress --
          --photos 500000 --gate
