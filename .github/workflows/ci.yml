name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
          - name: Linux
            os: ubuntu-latest
          - name: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust 1.99.1
        shell: bash
        run: >-
          rustup toolchain install 1.99.1 --profile minimal
          --component rustfmt --component clippy

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libfontconfig1-dev \
            libfreetype6-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcb-randr0-dev \
            libxcb-xtest0-dev \
            libxcb-xkb-dev \
            libxcb-render0-dev \
            libxcb-xinput-dev \
            libxcb-composite0-dev \
            libxcb-damage0-dev \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libswscale-dev

      # Development and CI link the system FFmpeg; releases compile their own.
      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg pkgconf

      - name: Restore the vcpkg FFmpeg build
        if: runner.os == 'Windows'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-ffmpeg-x64-windows-static-md-nomf-v1

      - name: Build FFmpeg with vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VCPKG_DEFAULT_BINARY_CACHE: ${{ runner.temp }}/vcpkg-cache
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          & "$env:GITHUB_WORKSPACE\packaging\windows\prepare-vcpkg-ffmpeg.ps1"
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install "ffmpeg[core,avcodec,avformat,swscale]:x64-windows-static-md" "--overlay-ports=$env:VCPKG_OVERLAY_PORTS"
          if ($LASTEXITCODE -ne 0) { throw "vcpkg could not build FFmpeg" }
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VCPKGRS_TRIPLET=x64-windows-static-md" | Out-File -FilePath $env:GITHUB_ENV -Append
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Check for committed OAuth credentials
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          if git grep -I -l -e "GOCSPX""-" -- .; then
            echo "::error::Google OAuth client secret is present in the repository."
            exit 1
          fi
          if git ls-files | grep -E '(^|/)(google-oauth|google-drive)\.json$|(^|/)client_secret_.*\.json$'; then
            echo "::error::Google OAuth credential file is tracked."
            exit 1
          fi

      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt-check

      - name: Clippy
        if: runner.os != 'Windows'
        run: cargo lint

      - name: Test
        if: runner.os != 'Windows'
        run: cargo test --workspace

      # Windows links vcpkg's static FFmpeg, which needs the static feature.
      - name: Clippy (Windows)
        if: runner.os == 'Windows'
        run: >-
          cargo clippy --workspace --all-targets --features slate-core/static-ffmpeg
          -- -D warnings

      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: cargo test --workspace --features slate-core/static-ffmpeg

  stress-500k:
    name: 500k stress gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust 1.99.1
        run: rustup toolchain install 1.99.1 --profile minimal

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev

      - name: Build and run the 500k gate
        run: >-
          cargo run --release -p slate-core --example stress --
          --photos 500000 --gate
