[workspace]
resolver = "3"
members = ["crates/slate-core", "crates/slate-app"]

[workspace.package]
version = "0.0.5"
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.90"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
im = "15.1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "tiff", "gif", "bmp"] }
kamadak-exif = "0.6"
roaring = "0.11"
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
anyhow = "1"
base64 = "0.21"
sha2 = "0.10"
google-drive = "0.10.0"
open = "5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["fs", "io-util", "net", "rt-multi-thread", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[patch.crates-io]
xattr = { path = "vendor/xattr" }
