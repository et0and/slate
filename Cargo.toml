[workspace]
resolver = "3"
members = ["crates/sheet-core", "crates/sheet-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.90"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "tiff", "gif", "bmp"] }
printpdf = { version = "0.12", default-features = false, features = ["jpeg", "png"] }
kamadak-exif = "0.6"
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
anyhow = "1"
